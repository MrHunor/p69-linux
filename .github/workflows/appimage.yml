```yaml
name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
          install-linux-dependencies: true

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libvlc-dev \
            libvlc5 \
            libvlccore9 \
            vlc-plugin-base \
            vlc-plugin-video-output \
            vlc-plugin-access-extra \
            portaudio19-dev \
            libsndfile1-dev \
            libkissfft-dev \
            libfuse2 \
            wget

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ steps.sdl.outputs.prefix }}"

      - name: Build P69
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Verify build
        run: |
          set -eux

          test -f build/P69
          test -d build/plugins

          chmod +x build/P69

          echo "P69:"
          file build/P69

          echo
          echo "VLC plugins:"
          find build/plugins -type f | sort | head -30

          echo
          echo "VLC plugin count:"
          find build/plugins -type f | wc -l

      - name: Download linuxdeploy
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Download AppImage plugin
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            -O linuxdeploy-plugin-appimage.AppImage

          chmod +x linuxdeploy-plugin-appimage.AppImage

      - name: Prepare AppDir
        run: |
          set -eux

          rm -rf AppDir

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/scalable/apps

          cp build/P69 AppDir/usr/bin/P69
          cp -a build/plugins AppDir/usr/bin/plugins

          cp assets/P69.png \
            AppDir/usr/share/icons/hicolor/scalable/apps/P69.png

      - name: Create desktop file
        run: |
          cat > AppDir/usr/share/applications/p69.desktop <<'EOF'
          [Desktop Entry]
          Name=P69
          Comment=P69
          Exec=P69
          Icon=P69
          Type=Application
          Categories=AudioVideo;
          Terminal=false
          EOF

      - name: Inspect VLC and AppDir before packaging
        run: |
          set -eux

          echo "Installed VLC packages:"
          dpkg -l | grep -E 'vlc|libvlc' || true

          echo
          echo "VLC plugin directories on build machine:"
          find /usr/lib -type d -path '*/vlc/plugins' -print || true

          echo
          echo "AppDir:"
          find AppDir/usr -maxdepth 3 -type f | sort | head -100

          echo
          echo "P69 dependencies:"
          ldd AppDir/usr/bin/P69

      - name: Build AppImage
        env:
          NO_STRIP: "1"
        run: |
          set -eux

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/P69 \
            --desktop-file AppDir/usr/share/applications/p69.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/P69.png \
            --exclude-library "libsystemd*" \
            --exclude-library "libdbus-*" \
            --exclude-library "libcap*" \
            --output appimage

      - name: Inspect generated AppDir
        run: |
          set -eux

          echo "Bundled libraries:"
          find AppDir/usr/lib -maxdepth 1 -type f -name '*.so*' | sort

          echo
          echo "Bundled VLC plugins:"
          find AppDir/usr/bin/plugins -type f | sort | head -30

          echo
          echo "Plugin count:"
          find AppDir/usr/bin/plugins -type f | wc -l

          echo
          echo "Checking for forbidden system libraries:"
          find AppDir/usr/lib -maxdepth 1 \
            \( -name 'libsystemd.so*' \
            -o -name 'libdbus-*.so*' \
            -o -name 'libcap.so*' \) \
            -print

          echo
          echo "Final P69 dependencies:"
          ldd AppDir/usr/bin/P69

      - name: Rename AppImage
        run: |
          set -eux

          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy.AppImage' \
            ! -name 'linuxdeploy-plugin-appimage.AppImage' \
            | head -n 1)

          test -n "$APPIMAGE"

          mv "$APPIMAGE" P69-linux-x86_64.AppImage
          chmod +x P69-linux-x86_64.AppImage

      - name: Smoke test AppImage
        run: |
          set -eux

          ./P69-linux-x86_64.AppImage --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/P69
          test -d squashfs-root/usr/bin/plugins

          echo "Extracted AppImage structure:"
          find squashfs-root/usr/bin -maxdepth 2 -type f | sort | head -100

          echo
          echo "VLC plugin count in AppImage:"
          find squashfs-root/usr/bin/plugins -type f | wc -l

      - name: Create new GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux

          TAG="build-${{ github.run_number }}"
          TITLE="P69 Automatic Build ${{ github.run_number }}"

          gh release create "$TAG" \
            P69-linux-x86_64.AppImage \
            --title "$TITLE" \
            --notes "Automatic build from commit ${{ github.sha }}.

            Commit message:
            ${{ github.event.head_commit.message }}"
```
