name: Build AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    # All build/package dependencies come from Arch Linux.
    # GitHub still provides the runner, but the job steps execute
    # inside this Arch container.
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Arch Linux
        shell: bash
        run: |
          pacman -Syu --noconfirm

      - name: Install build dependencies
        shell: bash
        run: |
          pacman -S --noconfirm \
            base-devel \
            cmake \
            pkgconf \
            git \
            curl \
            wget \
            gh \
            imagemagick \
            sdl3 \
            portaudio \
            libsndfile \
            kissfft \
            libvlc \
            vlc \
            vlc-gui-qt \
            vlc-plugins-base \
            vlc-plugins-video-output \
            vlc-plugin-ffmpeg

      - name: Show installed versions
        shell: bash
        run: |
          set -eux

          echo "=== VLC packages ==="
          pacman -Q | grep -E '^(libvlc|vlc)' || true

          echo
          echo "=== LibVLC ==="
          pacman -Qi libvlc

          echo
          echo "=== VLC plugin directory ==="
          find /usr/lib/vlc/plugins -maxdepth 2 -type f | sort | head -50

          echo
          echo "=== Plugin count ==="
          find /usr/lib/vlc/plugins -type f | wc -l

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build P69
        shell: bash
        run: |
          cmake --build build \
            --config Release \
            --parallel

      - name: Verify build
        shell: bash
        run: |
          set -eux

          test -f build/P69

          chmod +x build/P69

          echo "P69:"
          file build/P69

          echo
          echo "P69 dependencies:"
          ldd build/P69

      - name: Download linuxdeploy
        shell: bash
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Download AppImage plugin
        shell: bash
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage \
            -O linuxdeploy-plugin-appimage.AppImage

          chmod +x linuxdeploy-plugin-appimage.AppImage

      - name: Prepare AppDir
        shell: bash
        run: |
          set -eux

          rm -rf AppDir

          mkdir -p \
            AppDir/usr/bin \
            AppDir/usr/lib/vlc \
            AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/512x512/apps

          cp build/P69 AppDir/usr/bin/P69

          # IMPORTANT:
          # Use the VLC plugins installed by the SAME Arch packages
          # that supplied libvlc/libvlccore.
          cp -a /usr/lib/vlc/plugins AppDir/usr/lib/vlc/

          magick assets/P69.png \
            -resize 512x512 \
            -gravity center \
            -background none \
            -extent 512x512 \
            AppDir/usr/share/icons/hicolor/512x512/apps/P69.png

      - name: Create desktop file
        shell: bash
        run: |
          cat > AppDir/usr/share/applications/p69.desktop <<'EOF'
          [Desktop Entry]
          Name=P69
          Comment=P69
          Exec=P69
          Icon=P69
          Type=Application
          Categories=AudioVideo;
          Terminal=false
          EOF

      - name: Inspect VLC and AppDir before packaging
        shell: bash
        run: |
          set -eux

          echo "=== Installed VLC packages ==="
          pacman -Q | grep -E '^(vlc|libvlc)' || true

          echo
          echo "=== System LibVLC ==="
          ls -l /usr/lib/libvlc.so*
          ls -l /usr/lib/libvlccore.so*

          echo
          echo "=== System VLC plugins ==="
          find /usr/lib/vlc/plugins -type f | sort | head -50

          echo
          echo "System plugin count:"
          find /usr/lib/vlc/plugins -type f | wc -l

          echo
          echo "=== AppDir contents ==="
          find AppDir/usr -maxdepth 4 -type f | sort | head -150

          echo
          echo "=== AppDir VLC plugins ==="
          find AppDir/usr/lib/vlc/plugins -type f | sort | head -50

          echo
          echo "AppDir plugin count:"
          find AppDir/usr/lib/vlc/plugins -type f | wc -l

          echo
          echo "=== P69 dependencies ==="
          ldd AppDir/usr/bin/P69

      - name: Build AppImage
        shell: bash
        env:
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/P69 \
            --desktop-file AppDir/usr/share/applications/p69.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/P69.png \
            --output appimage

      - name: Inspect generated AppDir
        shell: bash
        run: |
          set -eux

          echo "=== Bundled libraries ==="
          find AppDir/usr/lib -maxdepth 1 -type f -name '*.so*' | sort

          echo
          echo "=== Bundled VLC libraries ==="
          find AppDir/usr/lib \
            -maxdepth 1 \
            \( -name 'libvlc*' -o -name 'libvlccore*' \) \
            -print | sort

          echo
          echo "=== Bundled VLC plugins ==="
          find AppDir/usr/lib/vlc/plugins -type f | sort | head -50

          echo
          echo "Plugin count:"
          find AppDir/usr/lib/vlc/plugins -type f | wc -l

          echo
          echo "=== Final P69 dependencies ==="
          ldd AppDir/usr/bin/P69

      - name: Rename AppImage
        shell: bash
        run: |
          set -eux

          APPIMAGE=$(find . -maxdepth 1 -type f -name '*.AppImage' \
            ! -name 'linuxdeploy.AppImage' \
            ! -name 'linuxdeploy-plugin-appimage.AppImage' \
            | head -n 1)

          test -n "$APPIMAGE"

          mv "$APPIMAGE" P69-linux-x86_64.AppImage
          chmod +x P69-linux-x86_64.AppImage

      - name: Smoke test AppImage
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux

          ./P69-linux-x86_64.AppImage --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/P69
          test -d squashfs-root/usr/lib/vlc/plugins

          echo "=== Extracted AppImage structure ==="
          find squashfs-root/usr/bin -maxdepth 2 -type f | sort | head -100

          echo
          echo "=== VLC plugins in AppImage ==="
          find squashfs-root/usr/lib/vlc/plugins -type f | sort | head -50

          echo
          echo "VLC plugin count:"
          find squashfs-root/usr/lib/vlc/plugins -type f | wc -l

          echo
          echo "=== VLC libraries in AppImage ==="
          find squashfs-root/usr/lib -maxdepth 1 \
            \( -name 'libvlc*' -o -name 'libvlccore*' \) \
            -print | sort

      - name: Create new GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux

          TAG="build-${{ github.run_number }}"
          TITLE="P69 Automatic Build ${{ github.run_number }}"

          gh release create "$TAG" \
            P69-linux-x86_64.AppImage \
            --title "$TITLE" \
            --notes "Automatic build from commit ${{ github.sha }}.

            Commit message:
            ${{ github.event.head_commit.message }}"